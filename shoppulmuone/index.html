<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>샵풀무원리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>

        <main>
            <div class="hero-sec">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="img/visual01.png" alt="할인배너" class="pc">
                            <img src="img/m_visual01.jpg" alt="모바일 할인배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual02.png" alt="아미오" class="pc">
                            <img src="img/m_visual02.jpg" alt="모바일아미오" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual03.png" alt="가을한상" class="pc">
                            <img src="img/m_visual03.jpg" alt="모바일가을한상" class="mo">
                        </div>
                    </div>

                    <!-- Figma 형태의 좌우 화살표 -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>

                    <!-- Figma 형태의 우측 하단 컨트롤 -->
                    <div class="visual-controls">
                        <div class="swiper-pagination"></div>
                        <button type="button" class="visual-autoplay" aria-label="자동재생 일시정지" aria-pressed="false">
                            <img src="img/Pause.svg" alt="">
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <footer>&copy;</footer>
    </div>

    <script>
        // 배너 원본은 3개지만, 양옆에 이전/다음 배너가 항상 보이도록 복제합니다.
        // Swiper 12의 loop는 슬라이드가 너무 적으면 정상 배치되지 않을 수 있습니다.
        const heroWrapper = document.querySelector('.hero-sec .swiper-wrapper');
        const originalSlides = Array.from(heroWrapper.children);
        const originalCount = originalSlides.length;
        originalSlides.forEach(slide => heroWrapper.appendChild(slide.cloneNode(true)));
        originalSlides.forEach(slide => heroWrapper.appendChild(slide.cloneNode(true)));

        const swiperHero = new Swiper('.hero-sec > .swiper', {
            direction: 'horizontal',
            slidesPerView: 'auto',
            centeredSlides: true,
            spaceBetween: 20,
            initialSlide: originalCount,
            loop: true,

            // 화면에는 복제된 개수가 아니라 원본 배너 개수만 표시합니다.

            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },

            autoplay: {
                delay: 5000,
                disableOnInteraction: false,
            },

        });

        const fraction = document.querySelector('.visual .swiper-pagination');
        function updateHeroFraction() {
            const current = (swiperHero.realIndex % originalCount) + 1;
            fraction.textContent = current + '  |  ' + originalCount;
        }
        swiperHero.on('slideChange', updateHeroFraction);
        updateHeroFraction();

        const autoplayButton = document.querySelector('.visual-autoplay');
        autoplayButton.addEventListener('click', () => {
            const paused = autoplayButton.getAttribute('aria-pressed') === 'true';
            if (paused) {
                swiperHero.autoplay.start();
                autoplayButton.setAttribute('aria-pressed', 'false');
                autoplayButton.setAttribute('aria-label', '자동재생 일시정지');
            } else {
                swiperHero.autoplay.stop();
                autoplayButton.setAttribute('aria-pressed', 'true');
                autoplayButton.setAttribute('aria-label', '자동재생 시작');
            }
        });
    </script>
</body>
</html>
